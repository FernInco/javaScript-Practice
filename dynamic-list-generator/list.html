<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>list</title>
</head>
<body>


    <script>
        let start = Number(prompt("Enter starting number"));
        let finish = Number(prompt("Enter finishing number"));
        for (let i = start; i <= finish; i++) {
            if (i % 2 == 0) {
                let created_para = createPara();
                let text = created_para.innerText = i;
                created_para.style.color = 'red'

                let sqr = square(i);
                created_para.innerText += ` | Square:${sqr}`;

            } else {
                let created_para = createPara();
                created_para.innerText = i;
                created_para.style.color = 'blue'

                let sqr = square(i);
                created_para.innerText += ` | Square:${sqr}`;
                
            }

            
            

        }

        function createPara() {
            let para = document.createElement('p');
            let p = document.body.append(para);
            return para;
        }

        function square(num) {
            let sq = num**2;
            return sq;

        }


    </script>
</body>
</html>
