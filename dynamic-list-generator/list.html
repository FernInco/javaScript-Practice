<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>list</title>
</head>
<body>


    <script>
        let start = Number(prompt("Enter starting number"));
        let finish = Number(prompt("Enter finishing number"));
        for (let i = start; start <= i && i <= finish; i++) {
            if (i % 2 == 0) {
                let para = document.createElement('p');
                let created_para = document.body.appendChild(para);
                let text = created_para.innerText = i;
                let color = created_para.style.color = 'red'

            }

            if (i % 2 != 0) {
                let para = document.createElement('p');
                let created_para = document.body.appendChild(para);
                let text = created_para.innerText = i;
                let color = created_para.style.color = 'blue'
                
            }

        }
    </script>
</body>
</html>
